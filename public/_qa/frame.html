<!doctype html><html><body style="margin:0;background:#888;overflow:hidden">
<iframe id="f" style="border:0;display:block;background:#fff"></iframe>
<script>
const q = new URLSearchParams(location.search), f = document.getElementById('f');
f.style.width = (q.get('w') || 1440) + 'px'; f.style.height = (q.get('h') || 900) + 'px';
f.onload = () => setTimeout(() => {
  const el = q.get('el') && f.contentDocument.querySelector(q.get('el'));
  f.contentWindow.scrollTo(0, el ? el.getBoundingClientRect().top + f.contentWindow.scrollY + Number(q.get('dy') || 0) : Number(q.get('y') || 0));
}, 800);
f.src = q.get('u') || '/';
</script></body></html>
